[project]
name = "docompare"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.1",
    "google-adk>=1.32.0",
    "google-genai>=1.74.0",
    "pydantic>=2.13.3",
    "python-multipart>=0.0.27",
    "uvicorn>=0.46.0",
]

[project.optional-dependencies]
eval = [
    "google-adk[eval]>=1.32.0",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.3",
]
lint = [
    "codespell>=2.3.0",
    "ruff>=0.9.0",
]

[tool.agents-cli]
agent_directory = "app"
region = "us-central1"

[tool.agents-cli.create_params]
deployment_target = "none"

